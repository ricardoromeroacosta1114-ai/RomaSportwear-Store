<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ROMA Sportswear</title>
<meta name="description" content="ROMA Sportswear — Arma tu outfit completo.">
<link rel="manifest" href="manifest.json">
<link rel="preload" as="image" href="icons/logo.png">
<meta name="theme-color" content="#FAF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ROMA">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
/* ================= TOKENS ================= */
:root{
  --papel:#FAF8F3; --papel2:#F1EDE4; --tinta:#141210; --tinta2:#3E3A33;
  --gris:#8A8177; --linea:#E4DED2; --oro:#B08D3E; --oro-suave:#C9A85C;
  --oro-tenue:#F0E6CE; --blanco:#FFFFFF; --verde:#3E7A4E; --rojo:#A8433B;
  --sombra:0 10px 30px rgba(20,18,16,.08); --r:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-tema="oscuro"]{
  --papel:#12100D; --papel2:#1B1815; --tinta:#F2EDE2; --tinta2:#CFC8BA;
  --gris:#8F877A; --linea:#2B2721; --oro:#C9A85C; --oro-suave:#C9A85C;
  --oro-tenue:#2A2418; --blanco:#1F1B16; --sombra:0 10px 30px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--papel);color:var(--tinta);
  font-size:15px;line-height:1.5;overflow-x:hidden;
  transition:background .35s ease,color .35s ease}
.serif{font-family:'Cormorant Garamond',serif}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select{font-family:inherit;font-size:inherit}
img,svg{display:block}
::selection{background:var(--oro-tenue)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ================= SPLASH ================= */
#splash{position:fixed;inset:0;background:var(--papel);z-index:200;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:13px}
#splash .sp-logo{width:164px;opacity:0;transform:scale(.74);
  animation:spLogo .8s cubic-bezier(.22,1,.36,1) .05s forwards}
#splash .sp-logo img{width:100%;height:auto;display:block}
#splash .logo-dark{display:none}
html[data-tema="oscuro"] #splash .logo-light{display:none}
html[data-tema="oscuro"] #splash .logo-dark{display:block}
#splash .marca{opacity:0;transform:translateY(9px);animation:spUp .6s cubic-bezier(.22,1,.36,1) .45s forwards}
#splash .sp-linea{width:0;height:2px;border-radius:2px;background:var(--oro);
  animation:spLinea .5s cubic-bezier(.22,1,.36,1) .65s forwards}
#splash .sub{opacity:0;transform:translateY(9px);letter-spacing:6px;font-size:11px;color:var(--oro);font-weight:600;
  animation:spUp .5s ease .8s forwards}
@keyframes spLogo{to{opacity:1;transform:scale(1)}}
@keyframes spUp{to{opacity:1;transform:translateY(0)}}
@keyframes spLinea{to{width:66px}}
#splash.out{animation:splashOut .45s ease forwards}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){
  #splash .sp-logo,#splash .marca,#splash .sub{animation-duration:.01s;animation-delay:0s}
  #splash .sp-linea{animation-duration:.01s;animation-delay:0s}
}

/* ================= APP SHELL ================= */
#app{display:none;min-height:100%;padding-bottom:calc(76px + var(--safe-b))}
#app.show{display:block}
header.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--papel) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:calc(12px + var(--safe-t)) 20px 12px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid transparent;transition:border-color .3s}
header.top.linea{border-color:var(--linea)}
.logo-r{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:23px;letter-spacing:5px}
.logo-r em{color:var(--oro);font-style:normal}
.top-sp{flex:1}
.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:19px;transition:background .2s}
.icon-btn:active{background:var(--papel2)}
.badge{position:absolute;top:2px;right:0;background:var(--oro);color:#fff;font-size:10px;
  min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:700;padding:0 4px;transform:scale(0);transition:transform .25s cubic-bezier(.34,1.6,.64,1)}
.badge.on{transform:scale(1)}
.badge.pop{animation:pop .4s cubic-bezier(.34,1.8,.64,1)}
@keyframes pop{40%{transform:scale(1.35)}}

/* vistas con transición */
#views{position:relative}
.view{animation:viewIn .32s cubic-bezier(.22,1,.36,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ================= NAV INFERIOR ================= */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:color-mix(in srgb,var(--papel) 92%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--linea);display:flex;
  padding:8px 6px calc(8px + var(--safe-b))}
nav.bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;letter-spacing:.6px;color:var(--gris);font-weight:600;padding:4px 0;
  transition:color .2s}
nav.bar button .ic{font-size:20px;line-height:1;transition:transform .25s cubic-bezier(.34,1.6,.64,1)}
nav.bar button.on{color:var(--tinta)}
nav.bar button.on .ic{transform:translateY(-2px)}
nav.bar button.on::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--oro);margin-top:1px}

/* ================= HOME ================= */
.hero{padding:26px 20px 8px}
.eyebrow{font-size:10.5px;letter-spacing:3.5px;color:var(--oro);font-weight:700;text-transform:uppercase}
.hero h1{font-size:44px;line-height:1.02;font-weight:600;margin:10px 0 12px}
.hero p{color:var(--gris);font-size:14.5px;max-width:290px}
.btn-oro{display:inline-flex;align-items:center;gap:9px;background:var(--tinta);color:var(--papel);
  padding:14px 24px;border-radius:100px;font-weight:600;font-size:14px;letter-spacing:.4px;
  margin-top:18px;transition:transform .15s,box-shadow .2s;box-shadow:var(--sombra)}
.btn-oro:active{transform:scale(.97)}
.btn-oro .fl{color:var(--oro-suave)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 20px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:9px 17px;border-radius:100px;border:1px solid var(--linea);
  font-size:13px;font-weight:600;color:var(--tinta2);background:var(--blanco);transition:.2s;white-space:nowrap}
.chip.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.sec{padding:22px 20px 6px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.sec-head h3{font-size:24px;font-weight:600}
.sec-head button{font-size:12.5px;color:var(--oro);font-weight:600}
.carrusel{display:flex;gap:14px;overflow-x:auto;padding:2px 20px 18px;scroll-snap-type:x proximity;scrollbar-width:none}
.carrusel::-webkit-scrollbar{display:none}

/* tarjeta producto */
.p-card{flex-shrink:0;width:172px;scroll-snap-align:start;text-align:left}
.p-fig{width:100%;aspect-ratio:4/5;border-radius:var(--r);background:var(--papel2);
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  transition:transform .2s}
.p-card:active .p-fig{transform:scale(.97)}
.p-fig svg{width:72%;height:auto;filter:drop-shadow(0 12px 16px rgba(20,18,16,.16))}
.tag{position:absolute;top:10px;left:10px;font-size:9.5px;letter-spacing:1.5px;font-weight:700;
  padding:5px 9px;border-radius:6px;background:var(--tinta);color:var(--papel)}
.tag.oferta{background:var(--oro);color:#fff}
.p-nombre{font-size:13.5px;font-weight:600;margin-top:10px}
.p-meta{font-size:12px;color:var(--gris);margin-top:1px}
.p-precio{font-size:14px;font-weight:700;margin-top:4px}
.p-precio s{color:var(--gris);font-weight:400;margin-left:6px;font-size:12px}

/* grid catálogo */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;padding:6px 20px 20px}
.grid .p-card{width:auto}

/* look curado */
.look-card{flex-shrink:0;width:264px;scroll-snap-align:start;border-radius:22px;overflow:hidden;
  background:var(--blanco);box-shadow:var(--sombra);border:1px solid var(--linea)}
.look-flat{position:relative;height:200px;background:linear-gradient(160deg,var(--papel2),var(--oro-tenue));
  display:flex;align-items:center;justify-content:center}
.look-flat svg{position:absolute;filter:drop-shadow(0 10px 14px rgba(20,18,16,.18))}
.look-body{padding:14px 16px 16px}
.look-body h4{font-size:17px;font-weight:600}
.look-body p{font-size:12px;color:var(--gris);margin:2px 0 10px}
.look-cta{display:flex;align-items:center;justify-content:space-between}
.look-cta b{font-size:15px}
.mini-btn{background:var(--tinta);color:var(--papel);padding:9px 15px;border-radius:100px;
  font-size:12px;font-weight:600;transition:transform .15s}
.mini-btn:active{transform:scale(.95)}
.mini-btn.sec2{background:var(--papel2);color:var(--tinta)}

/* ================= FILTROS ================= */
.filtros{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 4px;scrollbar-width:none;align-items:center}
.filtros::-webkit-scrollbar{display:none}
.f-sel{flex-shrink:0;padding:8px 13px;border-radius:100px;border:1px solid var(--linea);
  background:var(--blanco);font-size:12.5px;font-weight:600;color:var(--tinta2);
  appearance:none;-webkit-appearance:none}

/* ================= FICHA PRODUCTO ================= */
.ficha-fig{margin:8px 20px 0;border-radius:26px;background:var(--papel2);aspect-ratio:4/4.6;
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ficha-fig svg{width:62%;height:auto;filter:drop-shadow(0 22px 26px rgba(20,18,16,.2));
  transition:transform .35s cubic-bezier(.22,1,.36,1)}
.ficha-fig.zoom svg{transform:scale(1.5)}
.zoom-hint{position:absolute;bottom:12px;right:14px;font-size:10.5px;color:var(--gris);
  background:color-mix(in srgb,var(--blanco) 80%,transparent);padding:5px 10px;border-radius:100px;backdrop-filter:blur(6px)}
.ficha-body{padding:18px 20px 8px}
.ficha-body h1{font-size:30px;font-weight:600;line-height:1.1}
.estrellas{color:var(--oro);letter-spacing:2px;font-size:13px}
.opt-label{font-size:11px;letter-spacing:2px;font-weight:700;color:var(--gris);
  text-transform:uppercase;margin:18px 0 9px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--linea);position:relative;transition:.2s}
.sw.on{border-color:var(--oro);transform:scale(1.12);box-shadow:0 0 0 3px var(--oro-tenue)}
.tallas{display:flex;gap:9px;flex-wrap:wrap}
.tl{min-width:46px;padding:11px 0;text-align:center;border-radius:12px;border:1.5px solid var(--linea);
  font-weight:600;font-size:14px;transition:.15s;background:var(--blanco)}
.tl.on{border-color:var(--tinta);background:var(--tinta);color:var(--papel)}
.tl.agotada{opacity:.32;text-decoration:line-through;pointer-events:none}
.cta-fija{position:sticky;bottom:calc(76px + var(--safe-b));margin:14px 20px 6px;display:flex;gap:10px;z-index:30}
.btn-cart{flex:1;background:var(--tinta);color:var(--papel);border-radius:16px;padding:16px;
  font-weight:700;font-size:14.5px;letter-spacing:.4px;box-shadow:var(--sombra);
  transition:transform .15s,background .3s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-cart:active{transform:scale(.98)}
.btn-cart.ok{background:var(--verde)}
.combina{margin:8px 20px;padding:18px;border-radius:22px;background:var(--oro-tenue);
  border:1px solid color-mix(in srgb,var(--oro) 30%,transparent)}
.combina h3{font-size:21px;font-weight:600;margin-bottom:2px}
.combina>p{font-size:12.5px;color:var(--tinta2);margin-bottom:12px}
.combo-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.combo-row::-webkit-scrollbar{display:none}
.combo-it{flex-shrink:0;width:108px;background:var(--blanco);border-radius:16px;padding:10px;text-align:center}
.combo-it .cf{height:82px;display:flex;align-items:center;justify-content:center}
.combo-it .cf svg{height:74px;width:auto}
.combo-it span{font-size:11px;font-weight:600;display:block;line-height:1.25}
.combo-it small{color:var(--gris);font-size:10.5px}
.resena{padding:13px 0;border-top:1px solid var(--linea)}
.resena b{font-size:13px}
.resena p{font-size:13px;color:var(--tinta2);margin-top:3px}

/* ================= ARMADOR (signature) ================= */
.board{margin:10px 20px;border-radius:26px;background:var(--blanco);border:1px solid var(--linea);
  box-shadow:var(--sombra);overflow:hidden}
.board-flat{position:relative;height:330px;background:
  radial-gradient(120% 90% at 50% 0%,var(--oro-tenue),transparent 60%),var(--papel2)}
.slot{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;transition:.3s}
.slot svg{filter:drop-shadow(0 14px 18px rgba(20,18,16,.2));animation:slotIn .45s cubic-bezier(.22,1,.36,1)}
@keyframes slotIn{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
.slot.vacio{border:1.5px dashed color-mix(in srgb,var(--oro) 45%,transparent);border-radius:18px;
  color:var(--oro);font-size:11px;font-weight:700;letter-spacing:1.5px;background:color-mix(in srgb,var(--blanco) 55%,transparent)}
.slot-capa{top:14px;z-index:3}
.slot-arriba{top:38px;z-index:2}
.slot-abajo{top:150px;z-index:1}
.sello{position:absolute;top:12px;right:12px;background:var(--oro);color:#fff;font-size:10px;
  font-weight:800;letter-spacing:1px;padding:7px 11px;border-radius:100px;
  transform:rotate(4deg) scale(0);transition:transform .35s cubic-bezier(.34,1.7,.64,1)}
.sello.on{transform:rotate(4deg) scale(1)}
.board-info{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--linea)}
.board-info .tt{font-size:12px;color:var(--gris)}
.board-info .pp{font-size:22px;font-weight:700}
.board-info .pp small{font-size:12px;color:var(--verde);font-weight:700;display:block}
.pick-row{padding:0 20px;margin-top:16px}
.pick-row h4{font-size:12px;letter-spacing:2px;color:var(--gris);font-weight:700;text-transform:uppercase;margin-bottom:9px}
.pick-scroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.pick-scroll::-webkit-scrollbar{display:none}
.pick{flex-shrink:0;width:92px;border-radius:16px;border:1.5px solid var(--linea);background:var(--blanco);
  padding:9px 6px;text-align:center;transition:.15s}
.pick .pf{height:64px;display:flex;align-items:center;justify-content:center}
.pick .pf svg{height:58px;width:auto}
.pick span{font-size:10px;font-weight:600;display:block;line-height:1.2;margin-top:2px}
.pick.on{border-color:var(--oro);background:var(--oro-tenue)}
.pick.quitar{width:auto;padding:9px 12px;display:flex;align-items:center;color:var(--gris);font-size:11px;font-weight:700}
.armador-cta{margin:18px 20px 8px;display:flex;flex-direction:column;gap:10px}
.btn-linea{border:1.5px solid var(--linea);border-radius:16px;padding:14px;font-weight:600;
  font-size:14px;background:var(--blanco);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn-linea:active{transform:scale(.98)}

/* ================= CARRITO / CHECKOUT ================= */
.c-item{display:flex;gap:14px;padding:14px 20px;border-bottom:1px solid var(--linea);align-items:center}
.c-fig{width:74px;height:88px;border-radius:14px;background:var(--papel2);display:flex;
  align-items:center;justify-content:center;flex-shrink:0}
.c-fig svg{height:66px;width:auto}
.c-info{flex:1;min-width:0}
.c-info b{font-size:14px;display:block}
.c-info small{color:var(--gris);font-size:12px}
.c-edit{display:flex;gap:7px;margin-top:7px}
.c-edit select{border:1px solid var(--linea);border-radius:8px;padding:4px 7px;font-size:12px;background:var(--blanco);color:var(--tinta)}
.qty{display:flex;align-items:center;gap:2px;border:1px solid var(--linea);border-radius:100px;background:var(--blanco)}
.qty button{width:28px;height:28px;font-size:15px;color:var(--tinta2)}
.qty span{min-width:20px;text-align:center;font-size:13px;font-weight:700}
.c-precio{font-weight:700;font-size:14px;text-align:right}
.c-precio button{display:block;color:var(--rojo);font-size:11px;margin-top:8px;margin-left:auto}
.panel{margin:14px 20px;padding:18px;border-radius:20px;background:var(--blanco);border:1px solid var(--linea)}
.panel h4{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gris);font-weight:700;margin-bottom:12px}
.cod-row{display:flex;gap:9px}
.cod-row input{flex:1;border:1.5px solid var(--linea);border-radius:14px;padding:13px 15px;
  font-size:14px;background:var(--papel);color:var(--tinta);text-transform:uppercase;letter-spacing:1px;outline:none;transition:border-color .2s}
.cod-row input:focus{border-color:var(--oro)}
.cod-row input.ok{border-color:var(--verde)}
.cod-row input.mal{border-color:var(--rojo);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cod-msg{font-size:12px;margin-top:8px;font-weight:600}
.cod-msg.ok{color:var(--verde)} .cod-msg.mal{color:var(--rojo)}
.cupon{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;
  border:1px dashed color-mix(in srgb,var(--oro) 55%,transparent);border-radius:14px;margin-top:9px;background:var(--oro-tenue)}
.cupon b{font-size:13px;letter-spacing:1px}
.cupon small{display:block;color:var(--tinta2);font-size:11px;font-weight:500;letter-spacing:0}
.tot-row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;color:var(--tinta2)}
.tot-row.big{font-size:18px;font-weight:700;color:var(--tinta);border-top:1px solid var(--linea);margin-top:8px;padding-top:12px}
.tot-row .verde{color:var(--verde);font-weight:700}
.field{margin-bottom:13px}
.field label{font-size:11px;letter-spacing:1.5px;font-weight:700;color:var(--gris);text-transform:uppercase;display:block;margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--linea);border-radius:14px;padding:13px 15px;font-size:14.5px;background:var(--papel);color:var(--tinta);outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--oro)}
.entrega{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ent-opt{border:1.5px solid var(--linea);border-radius:16px;padding:14px;text-align:left;background:var(--blanco);transition:.15s}
.ent-opt b{font-size:13.5px;display:block}
.ent-opt small{color:var(--gris);font-size:11.5px}
.ent-opt.on{border-color:var(--oro);background:var(--oro-tenue)}
.vacio-msg{text-align:center;padding:70px 30px;color:var(--gris)}
.vacio-msg .big{font-size:46px;margin-bottom:10px}
.vacio-msg h3{color:var(--tinta);font-size:22px;font-weight:600;margin-bottom:6px}

/* confirmación */
.conf{ text-align:center;padding:56px 30px 20px}
.conf .sello-ok{width:86px;height:86px;border-radius:50%;background:var(--oro-tenue);
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:38px;
  animation:pop .5s cubic-bezier(.34,1.7,.64,1)}
.conf h2{font-size:30px;font-weight:600}
.conf p{color:var(--gris);font-size:14px;margin-top:8px;max-width:300px;margin-inline:auto}

/* ================= PERFIL ================= */
.nivel-card{margin:14px 20px;border-radius:24px;padding:22px;color:#F5EFE2;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#181512,#2E2618 70%,#4A3B1B)}
.nivel-card .eyebrow{color:var(--oro-suave)}
.nivel-card h3{font-size:26px;font-weight:600;margin:6px 0 2px}
.nivel-card p{font-size:12.5px;opacity:.75}
.nivel-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:16px;overflow:hidden}
.nivel-bar div{height:100%;background:var(--oro-suave);border-radius:3px;transition:width .6s ease}
.perfil-item{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--linea);font-size:14.5px;font-weight:600;width:100%;text-align:left}
.perfil-item .ic{font-size:19px;width:26px}
.perfil-item small{margin-left:auto;color:var(--gris);font-weight:500;font-size:12px}
.orden{padding:14px 20px;border-bottom:1px solid var(--linea)}
.orden .o-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.orden .o-head b{letter-spacing:.5px}
.orden .o-head span{color:var(--gris)}
.orden p{font-size:12.5px;color:var(--gris)}

/* toast */
#waFloat{position:fixed;right:16px;bottom:calc(92px + var(--safe-b));z-index:65;width:46px;height:46px;
  border-radius:50%;background:var(--blanco);border:1px solid var(--linea);box-shadow:var(--sombra);
  display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:21px;opacity:.92}
#waFloat:active{transform:scale(.94)}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(20px);
  background:var(--tinta);color:var(--papel);padding:12px 20px;border-radius:100px;font-size:13px;
  font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:120;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

/* modal hoja */
.hoja-bg{position:fixed;inset:0;background:rgba(10,9,7,.45);z-index:100;display:flex;
  align-items:flex-end;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.hoja{background:var(--papel);width:100%;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + var(--safe-b));
  max-height:84vh;overflow-y:auto;animation:hojaUp .35s cubic-bezier(.22,1,.36,1)}
@keyframes hojaUp{from{transform:translateY(60px);opacity:0}}
.hoja .asa{width:40px;height:4px;border-radius:2px;background:var(--linea);margin:4px auto 16px}

.back-row{display:flex;align-items:center;gap:6px;padding:12px 20px 0}
.back-row button{font-size:13px;font-weight:600;color:var(--gris);display:flex;align-items:center;gap:5px}
h2.titulo{font-size:30px;font-weight:600;padding:10px 20px 4px}
p.subtitulo{color:var(--gris);font-size:13.5px;padding:0 20px 8px}
</style>
</head>
