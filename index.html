      <nav class="cab-nav" aria-label="Principal">

      </nav>
    </div>
    <button class="cab-logo" onclick="go('home')" aria-label="OMA Sportwear, ir al inicio">
      <img class="logo-claro" src="marca/oma-claro.webp" width="736" height="220" alt="">
      <img class="logo-oscuro" src="marca/oma-oscuro.webp" width="727" height="220" alt="">
    </button>
    <div class="cab-acc">
      <button class="ico solo-pc" onclick="toggleTema()" aria-label="Cambiar entre modo claro y oscuro">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.2A8 8 0 0 1 9.8 4.5a8 8 0 1 0 9.7 9.7z"/></svg>

        <span class="badge" id="cartBadge" aria-hidden="true"></span>
      </button>
    </div>
  </header>
  <main id="views" tabindex="-1"></main>
  <nav class="barra" id="nav" aria-label="Secciones"></nav>
</div>

  <div class="cajon-in">
    <div class="cajon-cab">
      <img class="logo-claro" src="marca/oma-claro.webp" width="736" height="220" alt="OMA Sportwear">
      <img class="logo-oscuro" src="marca/oma-oscuro.webp" width="727" height="220" alt="OMA Sportwear">
      <button class="ico" onclick="cierraMenu()" aria-label="Cerrar el menú">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <nav class="cajon-nav" aria-label="Tienda">
      <button onclick="go('tienda')">Tienda</button>
      <button onclick="go('armador')">Arma tu outfit</button>
      <button onclick="go('looks')">Tus looks</button>
      <button onclick="go('perfil')">Tu cuenta</button>
    </nav>
    <div class="cajon-sec">

      <a href="/envios/">Envíos</a>

  </div>
</dialog>
